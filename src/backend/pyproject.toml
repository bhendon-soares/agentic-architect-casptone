[project]
name = "support-backend"
version = "0.1.0"
description = "Backend scaffold for the IT Help Desk MVP"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23,<26",
    "certifi>=2026.10.19",
    "crewai[azure-ai-inference]>=1,<2",
    "fastapi>=0.115,<1",
    "filelock>=4.2.1,<5",
    "httpx>=0.27,<1",
    "mcp>=1.30,<2",
    "pillow>=13,<14",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "PyJWT>=2.9,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.34,<1",
    "uv>=0.13.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]